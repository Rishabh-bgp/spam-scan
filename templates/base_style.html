<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05060a">
<style>
  /* SPAM//SCAN cyberpunk theme. System fonts only, no external assets. */
  :root {
    --bg: #05060a; --bg2: #0a0d18;
    --panel: rgba(12, 17, 32, .72); --panel-solid: #0c1120;
    --text: #e8f3ff; --muted: #93a4bf; --dim: #7d8ca8;
    --cyan: #00f0ff; --magenta: #ff2bd6; --yellow: #f2ff3d;
    --border: rgba(0, 240, 255, .22); --border-strong: rgba(0, 240, 255, .55);
    --accent: var(--cyan); --accent-dark: #00b8c4; --card: var(--panel);
    --spam: #ff3d7f; --spam-bg: rgba(255, 43, 107, .10);
    --ham: #2bffa3; --ham-bg: rgba(43, 255, 163, .08);
    --unsure: var(--yellow); --unsure-bg: rgba(242, 255, 61, .08);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace;
    --glow-c: 0 0 6px rgba(0, 240, 255, .55), 0 0 18px rgba(0, 240, 255, .25);
    --glow-m: 0 0 6px rgba(255, 43, 214, .6), 0 0 18px rgba(255, 43, 214, .28);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; position: relative;
    font-family: var(--mono); font-size: 15px; color: var(--text); line-height: 1.6;
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(255, 43, 214, .14), transparent 60%),
      radial-gradient(900px 600px at -10% 20%, rgba(0, 240, 255, .12), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    background-attachment: fixed;
  }
  /* grid overlay */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(0, 240, 255, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, .05) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 50% 30%, #000 40%, transparent 85%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 40%, transparent 85%);
  }
  /* scanlines */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100;
    background: repeating-linear-gradient(180deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
  }
  main, footer { position: relative; z-index: 1; }
  main { flex: 1; width: 100%; max-width: 920px; margin: 0 auto; padding: 34px 18px 24px; }

  /* terminal header */
  .term { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
          padding: 10px 14px; border: 1px solid var(--border); background: rgba(5, 8, 16, .7);
          border-radius: 10px; box-shadow: inset 0 0 24px rgba(0, 240, 255, .05); }
  .term .dots { display: inline-flex; gap: 6px; margin-right: 10px; vertical-align: middle; }
  .term .dots i { width: 9px; height: 9px; border-radius: 50%; display: block; background: var(--magenta); box-shadow: var(--glow-m); }
  .term .dots i:nth-child(2) { background: var(--yellow); box-shadow: 0 0 8px rgba(242, 255, 61, .6); }
  .term .dots i:nth-child(3) { background: var(--cyan); box-shadow: var(--glow-c); }
  .brand { margin: 0; font-size: 1.45rem; font-weight: 800; letter-spacing: .08em; color: var(--cyan);
           text-shadow: var(--glow-c); display: inline-flex; align-items: center; white-space: nowrap; }
  .brand .sl { color: var(--magenta); text-shadow: var(--glow-m); margin: 0 1px; }
  .brand .ver { font-size: .7rem; color: var(--yellow); text-shadow: none; border: 1px solid rgba(242, 255, 61, .5);
                border-radius: 4px; padding: 0 5px; margin-left: 10px; letter-spacing: .05em; }
  .brand .cursor { color: var(--cyan); margin-left: 6px; animation: blink 1.1s steps(1) infinite; }
  .term nav { display: flex; gap: 14px; }
  .term nav a { font-size: .85rem; }
  .statusline { margin: 8px 2px 22px; font-size: .78rem; color: var(--muted); letter-spacing: .02em; }
  .statusline .ok { color: var(--ham); } .statusline b { color: var(--text); font-weight: 600; }
  @keyframes blink { 50% { opacity: 0; } }

  h1, h2, h3 { font-family: var(--mono); letter-spacing: .03em; }
  h2 { font-size: 1rem; margin: 28px 0 12px; color: var(--cyan); text-transform: uppercase; }
  h2::before { content: "// "; color: var(--magenta); }
  h3 { font-size: .82rem; margin: 18px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .subtitle { margin: 4px 0 22px; color: var(--muted); }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px;
          backdrop-filter: blur(12px) saturate(140%); -webkit-backdrop-filter: blur(12px) saturate(140%);
          box-shadow: 0 0 0 1px rgba(0, 240, 255, .04), 0 10px 40px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .04);
          position: relative; }
  .card::before { /* neon corner brackets */
    content: ""; position: absolute; inset: -1px; border-radius: 14px; pointer-events: none;
    background:
      linear-gradient(var(--cyan), var(--cyan)) top left / 18px 2px no-repeat,
      linear-gradient(var(--cyan), var(--cyan)) top left / 2px 18px no-repeat,
      linear-gradient(var(--magenta), var(--magenta)) bottom right / 18px 2px no-repeat,
      linear-gradient(var(--magenta), var(--magenta)) bottom right / 2px 18px no-repeat;
    filter: drop-shadow(0 0 4px rgba(0, 240, 255, .6));
  }

  a { color: var(--cyan); text-decoration: none; }
  a:hover { text-shadow: var(--glow-c); text-decoration: underline; }
  table { width: 100%; border-collapse: collapse; font-size: .84rem; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid rgba(0, 240, 255, .1); vertical-align: top; }
  th { color: var(--cyan); font-weight: 600; text-transform: uppercase; font-size: .72rem; letter-spacing: .08em; }
  tr:hover td { background: rgba(0, 240, 255, .03); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  code, .mono { font-family: var(--mono); font-size: .88em; }
  code { color: var(--yellow); background: rgba(242, 255, 61, .07); padding: 1px 5px; border-radius: 4px; }
  .muted { color: var(--muted); }
  ul, ol { padding-left: 22px; } li { margin-bottom: 6px; }
  li::marker { color: var(--magenta); }

  footer { text-align: center; color: var(--muted); font-size: .78rem; padding: 22px 16px 28px;
           border-top: 1px solid rgba(0, 240, 255, .1); margin-top: 20px; }

  /* accessibility */
  :focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; border-radius: 6px; }
  ::selection { background: rgba(255, 43, 214, .45); color: #fff; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 560px) {
    main { padding: 18px 12px 18px; } .card { padding: 16px; }
    .brand { font-size: 1.15rem; } .term .dots { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
  @media (prefers-contrast: more) { body::after, body::before { display: none; } :root { --muted: #c3cee0; } }
</style>
