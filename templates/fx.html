{# Shared hacker FX: matrix rain canvas + one-time boot sequence. Both are skipped under prefers-reduced-motion. #}
<canvas id="matrix" aria-hidden="true"></canvas>
<div id="boot" aria-hidden="true" hidden><pre id="bootlog"></pre><div class="boot-skip">press any key or click to skip</div></div>
<style>
  #matrix { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: .13; }
  #boot { position: fixed; inset: 0; z-index: 200; background: #020306; display: flex; flex-direction: column;
          justify-content: center; padding: 8vh 8vw; cursor: pointer; transition: opacity .25s; }
  #boot[hidden] { display: none; }
  #boot.out { opacity: 0; }
  #boot pre { margin: 0; font: 600 14px/1.7 var(--mono); color: #39ff6a; text-shadow: 0 0 6px rgba(57, 255, 106, .55); white-space: pre-wrap; }
  #boot pre .c { color: var(--cyan); text-shadow: var(--glow-c); } #boot pre .m { color: var(--magenta); text-shadow: var(--glow-m); }
  .boot-skip { margin-top: 18px; font: 12px var(--mono); color: var(--dim); }
  @media (prefers-reduced-motion: reduce) { #matrix, #boot { display: none !important; } }
</style>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  /* ---- matrix rain (cheap: ~18 fps, pauses when tab hidden) ---- */
  const cv = document.getElementById('matrix'), ctx = cv.getContext('2d');
  const glyphs = 'アカサタナハマヤラワ01234567890ABCDEFｦｱｳｴｵｶｷｸｹｺ$#@%&*<>/\\'.split('');
  let cols = [], fs = 15, w = 0, h = 0, last = 0, raf = 0;
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fs = w < 600 ? 13 : 15; cols = Array.from({ length: Math.ceil(w / (fs * 1.6)) }, () => Math.random() * -h / fs);
  }
  function frame(t) {
    raf = requestAnimationFrame(frame);
    if (t - last < 55) return; last = t;
    ctx.fillStyle = 'rgba(5, 6, 10, .14)'; ctx.fillRect(0, 0, w, h);
    ctx.font = fs + 'px ui-monospace, Menlo, Consolas, monospace';
    for (let i = 0; i < cols.length; i++) {
      const x = i * fs * 1.6, y = cols[i] * fs;
      ctx.fillStyle = Math.random() < .06 ? '#ff2bd6' : (Math.random() < .5 ? '#00f0ff' : '#39ff6a');
      ctx.fillText(glyphs[(Math.random() * glyphs.length) | 0], x, y);
      cols[i] = y > h + Math.random() * 4000 ? 0 : cols[i] + 1;
    }
  }
  resize(); addEventListener('resize', resize);
  raf = requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', () => {
    cancelAnimationFrame(raf); if (!document.hidden) raf = requestAnimationFrame(frame);
  });

  /* ---- boot sequence: ~1s, once per session, skippable, skipped for deep links (?q=) ---- */
  const boot = document.getElementById('boot'), log = document.getElementById('bootlog');
  if (!boot) return;
  let seen = false; try { seen = !!sessionStorage.getItem('booted'); sessionStorage.setItem('booted', '1'); } catch (e) {}
  if (seen || new URLSearchParams(location.search).has('q')) { boot.remove(); return; }
  const lines = [
    '<span class="c">SPAM//SCAN v2</span> :: bootloader',
    '[ ok ] mounting /dev/tfidf ............ {{ "{:,}".format(fx.features) }} features',
    '[ ok ] loading logistic_regression.bin',
    '[ ok ] arming red-flag rules ({{ fx.rules }}) + safe signals ({{ fx.safe }})',
    '[ ok ] {{ fx.datasets }} public datasets indexed',
    '<span class="m">[ !! ]</span> trust nothing. verify everything.',
    '&gt; ready_',
  ];
  boot.hidden = false; let i = 0, done = false;
  const finish = () => { if (done) return; done = true; boot.classList.add('out'); setTimeout(() => boot.remove(), 260);
                         removeEventListener('keydown', finish); };
  boot.addEventListener('click', finish); addEventListener('keydown', finish);
  (function next() { if (done) return; if (i < lines.length) { log.innerHTML += lines[i++] + '\n'; setTimeout(next, 120); }
                     else setTimeout(finish, 250); })();
})();
</script>
